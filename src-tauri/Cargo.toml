[package]
name = "opentick"
version = "0.5.3"
description = "Open-source TickTick-style task manager"
license = "Unlicense"
repository = "https://github.com/JebbyCodes/OpenTick"
edition = "2021"

[lib]
name = "opentick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
