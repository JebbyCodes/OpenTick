server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # the service worker must always be re-checked or an update never arrives
  location ~ /sw\.js$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location /eink/ { try_files $uri $uri/ /eink/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
