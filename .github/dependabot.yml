
version: 2

updates:
  # Frontend dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies

  # Rust and Tauri dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-android
      - /.github/actions/setup-node
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Base images in the Dockerfile (node, nginx)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
