name: Set up the Android build
description: >
  Everything an Android build needs, in the order it is needed: Java, the Android SDK and NDK, the Rust compiler with the four Android targets,
  the generated Tauri Android project (with the OpenTick home-screen widgets and background service added) and release signing taken from
  repository secrets. After this step, `npx tauri android build ...` produces signed APKs. The signing key lives only on the runner and
  is never written to the repository.

inputs:
  targets:
    description: Rust targets to install (the four Android CPU families by default)
    default: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
  key-base64:
    description: The release keystore (.jks file) encoded as base64
    required: true
  key-password:
    description: Password for the keystore and the key (they must be the same)
    required: true
  key-alias:
    description: Name of the key inside the keystore
    required: true

runs:
  using: composite
  steps:
    # ---- 1. Java: Gradle (the Android build tool) needs JDK 17 -------------------------------------------------------------------------
    - name: Install Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    # ---- 2. The Android SDK ------------------------------------------------------------------------------------------------------------
    - name: Install the Android command-line tools
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
        accept-android-sdk-licenses: 'true'
        log-accepted-android-sdk-licenses: 'false'

    - name: Install the SDK platform, build tools and NDK
      shell: bash
      env:
        ANDROID_API: '35'
        BUILD_TOOLS: '35.0.0'
        NDK: '27.0.12077973'
      run: |
        set -euo pipefail
        sdkmanager --install "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK}" >/dev/null
        # later steps (and Tauri) find the NDK and the signing tool through these two variables
        {
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS"
        } >> "$GITHUB_ENV"
        test -d "$ANDROID_HOME/ndk/$NDK"

    # ---- 3. Rust, with a build cache so repeat builds are quick -----------------------------------------------------------------------
    - name: Install Rust with the Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}

    - name: Cache the Rust build
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        key: android

    - name: Cache Gradle
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/tauri.conf.json') }}
        restore-keys: gradle-${{ runner.os }}-

    # ---- 4. The Android project Tauri generates, plus OpenTick's own additions ---------------------------------------------------------
    - name: Generate the Android project and add the OpenTick widgets and service
      shell: bash
      run: |
        set -euo pipefail
        test -f src-tauri/icons/icon.png || { echo "::error::Missing src-tauri/icons/icon.png"; exit 1; }
        [ -d src-tauri/gen/android ] || npx tauri android init
        test -f src-tauri/gen/android/app/build.gradle.kts || { echo "::error::app/build.gradle.kts was not generated"; exit 1; }
        chmod +x src-tauri/gen/android/gradlew
        node scripts/android/android-widgets.mjs
        npx tauri icon src-tauri/icons/icon.png >/dev/null

    # ---- 5. Release signing ------------------------------------------------------------------------------------------------------------
    - name: Configure release signing (the key stays on the runner)
      shell: bash
      env:
        ANDROID_KEY_BASE64: ${{ inputs.key-base64 }}
        ANDROID_KEY_PASSWORD: ${{ inputs.key-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
      run: python3 scripts/android/configure-signing.py
