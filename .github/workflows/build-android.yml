name: Build / Android

# Signed APKs for every phone: universal, one per CPU (64-bit and 32-bit ARM, x86), an App Bundle, and an e-ink edition.
on:
  workflow_call:
    inputs:
      version:
        description: Version being built (x.y.z), used in file names
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version being built (x.y.z), used in file names
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Standard (all CPUs + bundle), edition: '', require: 'universal,arm64,arm,x86_64,x86' }
          - { name: E-ink edition, edition: eink, require: 'universal' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-android
        with:
          key-base64: ${{ secrets.ANDROID_KEY_BASE64 }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      # one Gradle run builds the universal APK and the App Bundle; a second packs one APK per CPU (the Rust code is already compiled, so it is quick)
      - name: Build universal APK and App Bundle
        if: matrix.edition == ''
        run: npx tauri android build --apk --aab
      - name: Build one APK per CPU (arm64-v8a, armeabi-v7a, x86_64, x86)
        if: matrix.edition == ''
        run: npx tauri android build --apk --split-per-abi

      # the e-ink build is the same app with e-ink mode on by default (build-app.mjs reads OPENTICK_EINK); only the CPUs e-readers use
      - name: Build e-ink APK
        if: matrix.edition == 'eink'
        env:
          OPENTICK_EINK: '1'
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Check the Android version matches package.json
        run: node scripts/android/check-android-version.mjs --generated

      - name: Name the files and verify the signatures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android/stage-apks.mjs --version "${{ inputs.version }}" --out staged --edition "${{ matrix.edition }}" --require "${{ matrix.require }}"
          for f in staged/*.apk; do
            "$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$f" | head -3
          done
          ls -l staged

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-android-${{ matrix.edition || 'standard' }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14
