
name: Deploy OpenTick Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenTick web app
        run: npm run build:app

      - name: Verify website output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not generated."
            echo "Build output:"
            find dist -maxdepth 3 -type f -print 2>/dev/null || true
            echo "Repository root:"
            ls -la
            exit 1
          fi

          echo "Website entry point found."
          find dist -maxdepth 2 -type f -print

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5