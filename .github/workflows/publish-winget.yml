name: Publish / Winget

# =====================================================================================================================================
#  Publish / Winget: `winget install JebbyCodes.OpenTick`
# =====================================================================================================================================
#  Opens a pull request on microsoft/winget-pkgs that points the existing OpenTick package at the new release. Microsoft's bots and
#  moderators review it. This only UPDATES a package that already exists there; the very first submission is done once, by hand.
#
#  It stays switched off (skipped with a notice, never red) until you set:
#    variable  WINGET_IDENTIFIER   the package ID, for example JebbyCodes.OpenTick
#    secret    WINGET_TOKEN        a classic personal access token with `public_repo`, from an account that has forked microsoft/winget-pkgs
#
#  Called by: Release (stable releases only).
#  Retry by hand: Actions -> Publish / Winget -> Run workflow -> tag (for example v0.5.3).
# =====================================================================================================================================

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (for example v0.5.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.5.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: Submit to winget-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that Winget is set up
        id: gate
        shell: bash
        env:
          IDENTIFIER: ${{ vars.WINGET_IDENTIFIER }}
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$IDENTIFIER" ] && [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Winget skipped::Set the WINGET_IDENTIFIER variable and the WINGET_TOKEN secret to publish to winget."
          fi

      # The regular expression picks out the installers to list: 64-bit, 32-bit and ARM64 setup programs.
      - name: Submit the update
        if: steps.gate.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER }}
          release-tag: ${{ inputs.tag }}
          installers-regex: '_x(64|86)-setup\.exe$|_arm64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
