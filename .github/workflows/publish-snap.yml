name: Snap Store publishing preflight (upload disabled)

# Manual-only until the Snap Store listing, credentials, and publishing path are verified.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub Release tag to preflight (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release Snap asset
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Validate tag and download exact release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo '::error::Expected a stable vX.Y.Z tag.'; exit 1; fi
          RELEASE_STATE="$(gh release view "$TAG" --repo JebbyCodes/OpenTick --json isDraft,isPrerelease -q '. | select(.isDraft == false and .isPrerelease == false)')"
          if [[ -z "$RELEASE_STATE" ]]; then echo '::error::Release is a draft or prerelease.'; exit 1; fi
          mkdir -p release-snap
          gh release download "$TAG" --repo JebbyCodes/OpenTick --pattern '*.snap' --dir release-snap
          mapfile -t snaps < <(find release-snap -maxdepth 1 -type f -name '*.snap' -print)
          if [[ "${#snaps[@]}" -ne 1 ]]; then echo "::error::Expected exactly one .snap asset; found ${#snaps[@]}."; find release-snap -maxdepth 1 -type f -print; exit 1; fi
          echo "Preflight passed: ${snaps[0]}"
          echo 'No upload to the Snap Store was attempted. Store publishing remains disabled until authentication and upload are verified.'