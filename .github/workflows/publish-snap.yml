
name: Build OpenTick Snap

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build (for example v0.5.1)
        required: true
        type: string

      publish_to_store:
        description: Publish the Snap to the Snap Store after building
        required: true
        type: boolean
        default: false

      channel:
        description: Snap Store channel
        required: true
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
        default: candidate

permissions:
  contents: write

concurrency:
  group: publish-snap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach Snap
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check project versions
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Validate release version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"

          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          if [[ "$CONFIG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match Tauri version $CONFIG_VERSION."
            exit 1
          fi

          if [[ ! -f snap/snapcraft.yaml ]]; then
            echo "::error::snap/snapcraft.yaml was not found."
            exit 1
          fi

          sed -i -E \
            "s/^version:.*/version: '$VERSION'/" \
            snap/snapcraft.yaml

          echo "Building OpenTick $VERSION from $TAG"

      - name: Install Snapcraft
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/snap/bin:$PATH"

          if ! command -v snap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes snapd
          fi

          sudo systemctl enable --now snapd.socket

          SNAP_READY=false

          for attempt in {1..30}; do
            if sudo snap list >/dev/null 2>&1; then
              SNAP_READY=true
              break
            fi

            sleep 2
          done

          if [[ "$SNAP_READY" != "true" ]]; then
            echo "::error::snapd did not become available."
            sudo systemctl status snapd.socket --no-pager || true
            exit 1
          fi

          if ! sudo snap list snapcraft >/dev/null 2>&1; then
            sudo snap install snapcraft --classic --channel=stable
          fi

          export PATH="/snap/bin:$PATH"
          snapcraft --version

      - name: Build Snap package
        id: build
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/snap/bin:$PATH"

          SNAPCRAFT_BIN="$(command -v snapcraft)"
          BUILD_PATH="$PATH"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_DIR="${RUSTUP_HOME:-$HOME/.rustup}"

          echo "Building OpenTick Snap using destructive mode."

          sudo env \
            "PATH=$BUILD_PATH" \
            "CARGO_HOME=$CARGO_DIR" \
            "RUSTUP_HOME=$RUSTUP_DIR" \
            "SNAPCRAFT_BUILD_INFO=1" \
            "$SNAPCRAFT_BIN" pack \
              --destructive-mode \
              --verbosity=brief

          mapfile -d '' SNAP_FILES < <(
            find . -maxdepth 1 -type f -name '*.snap' -print0
          )

          if [[ "${#SNAP_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Snap package, found ${#SNAP_FILES[@]}."
            find . -maxdepth 3 -type f -name '*.snap' -print || true
            exit 1
          fi

          SNAP_FILE="${SNAP_FILES[0]}"

          chmod a+r "$SNAP_FILE"

          echo "Built: $SNAP_FILE"
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Snap build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Snap-${{ github.ref_name }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Wait for GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG exists."
              exit 0
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::GitHub Release $RELEASE_TAG was not found after 10 minutes."
              exit 1
            fi

            sleep 10
          done

      - name: Attach Snap to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -euo pipefail

          test -s "$SNAP_FILE"

          gh release upload \
            "$RELEASE_TAG" \
            "$SNAP_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Attached $(basename "$SNAP_FILE") to $RELEASE_TAG."

  publish-store:
    name: Publish to Snap Store
    needs: build

    if: >-
      github.event_name == 'push' ||
      inputs.publish_to_store == true

    uses: ./.github/workflows/publish-snap-store.yml

    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      channel: ${{ github.event_name == 'push' && 'candidate' || inputs.channel }}

    secrets: inherit
