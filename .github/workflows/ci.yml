name: CI

# =====================================================================================================================================
#  CI: "does this change break anything?"
# =====================================================================================================================================
#  Runs three independent checks side by side:
#
#    1. Tests and checks   version numbers agree, the workflow files are consistent, the unit tests pass, the web app builds
#    2. Browser tests      the real app in headless Chromium (Playwright)
#    3. Rust check         the desktop / mobile shell still compiles (`cargo check --locked`)
#
#  When it runs
#    - on every pull request and on every push to `main`
#    - by hand: Actions -> CI -> Run workflow
#    - from the Release workflow, as its first gate: a tag never builds anything if these fail
#
#  It needs no secrets and only reads the repository.
# =====================================================================================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------------------------------------------------------------
  # 1. Unit tests and repository checks
  # -------------------------------------------------------------------------------------------------------------------------------
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install npm packages
        uses: ./.github/actions/setup-node

      # Python is only needed by the workflow linter (it reads the YAML files with PyYAML).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PyYAML (used by the workflow linter)
        run: python -m pip install --disable-pip-version-check PyYAML

      # The cheap, fast checks come first so a mistake is reported in seconds rather than after the whole test suite.
      - name: Check that every file carries the same version number
        run: npm run version:check

      - name: Check the GitHub workflow files for mistakes
        run: python scripts/ci/lint-workflows.py

      - name: Run the unit and regression tests
        run: npm test

      - name: Build the web app
        shell: bash
        run: |
          set -euo pipefail
          npm run build:app
          if [ ! -s dist/index.html ]; then
            echo "::error::The build did not produce dist/index.html."
            exit 1
          fi
          echo "The web app built successfully."

      - name: Keep the build output if something failed (to help debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-build-diagnostics
          path: dist/
          if-no-files-found: ignore
          retention-days: 3

  # -------------------------------------------------------------------------------------------------------------------------------
  # 2. Browser tests: the built app, driven like a user would
  # -------------------------------------------------------------------------------------------------------------------------------
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install npm packages
        uses: ./.github/actions/setup-node

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # What the browser tests import or run:
      #   playwright    drives Chromium (every test)
      #   Pillow        test_background.py measures the colours of the animated background ("from PIL import Image")
      #   poppler-utils test_help_about.py checks the PDF the app prints, with `pdfinfo` and `pdftotext`
      # None of these are on the runner by default, which made the two tests crash before they could even start.
      - name: Install the Python packages the browser tests use (Playwright and Pillow)
        run: python -m pip install --disable-pip-version-check playwright Pillow

      - name: Install the PDF tools the browser tests use (pdfinfo, pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium

      # Fail here, with a clear message, if a tool is missing; not halfway through a test with a Python traceback.
      - name: Check that everything the browser tests need is present
        shell: bash
        run: |
          set -euo pipefail
          python -c "import PIL, playwright; print('Pillow', PIL.__version__, '+ Playwright import OK')"
          pdfinfo -v
          pdftotext -v

      - name: Build the web app
        run: npm run build:app

      # A typo in a folder name must not make this job "pass" by running zero tests.
      - name: Make sure there are browser tests to run
        shell: bash
        run: |
          set -euo pipefail
          if ! find test/browser -maxdepth 1 -type f -name 'test_*.py' | grep -q .; then
            echo "::error::No browser test files were found in test/browser."
            exit 1
          fi
          echo "Browser test files:"
          find test/browser -maxdepth 1 -type f -name 'test_*.py' | sort

      - name: Run the browser tests
        run: npm run test:browser

      - name: Keep the test output if something failed (to help debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: |
            test-results/
            playwright-report/
            test/browser/
          if-no-files-found: ignore
          retention-days: 3

  # -------------------------------------------------------------------------------------------------------------------------------
  # 3. Rust: does the native shell still compile?
  # -------------------------------------------------------------------------------------------------------------------------------
  rust:
    name: Rust check
    # 22.04 on purpose: it has the WebKitGTK 4.1 packages Tauri 2 links against, and matches the Linux release build.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install npm packages
        uses: ./.github/actions/setup-node

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci

      - name: Install the Linux libraries Tauri needs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libxdo-dev libssl-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      # Tauri embeds the built web app into the binary, so it must exist before Rust is compiled.
      - name: Build the web app (the Rust code embeds it)
        run: npm run build:app

      - name: Make sure Cargo.lock is committed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src-tauri/Cargo.lock ]; then
            echo "::error::src-tauri/Cargo.lock is missing. Run cargo build once and commit it."
            exit 1
          fi

      # --locked refuses to change Cargo.lock, so a stale lock file is an error here rather than a surprise in the release build.
      - name: Check that the Rust code compiles
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Keep the build logs if something failed (to help debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-ci-diagnostics
          path: |
            src-tauri/target/debug/build/
            src-tauri/target/debug/.fingerprint/
          if-no-files-found: ignore
          retention-days: 3
