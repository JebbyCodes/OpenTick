name: Build OpenTick

on:
  # Manually build selected platforms from GitHub Actions.
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Build Windows, Linux, and macOS packages
        required: true
        type: boolean
        default: true
      build_android:
        description: Build a signed Android APK
        required: true
        type: boolean
        default: true
      build_snap:
        description: Build a Linux Snap package
        required: true
        type: boolean
        default: true

  # Validate pull requests without publishing release assets.
  pull_request:
    branches: [main]

  # Build all platforms and publish a release when a version tag is pushed.
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project versions
        run: npm run version:check

      - name: Run test suite
        run: npm test

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: validate
    if: github.event_name == 'push' || inputs.build_desktop
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-22.04
          - platform: macOS
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Build desktop packages
        run: npx tauri build

      - name: Upload desktop build output
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android Signed APK
    needs: validate
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Install modern command-line tools and platform-tools.
      # Do not request the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager was not found after Android SDK setup."
            exit 1
          fi

          SDKMANAGER_PATH="$(readlink -f "$(command -v sdkmanager)")"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER_PATH")/../../.." && pwd)"

          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android command-line tools were not found in $SDK_ROOT."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK root: $SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Expected Android NDK was not installed: $NDK_PATH"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Initialise Tauri Android project if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

          if [ ! -f src-tauri/gen/android/gradlew ]; then
            echo "::error::The Android Gradle wrapper was not generated."
            exit 1
          fi

          if [ ! -f src-tauri/gen/android/app/build.gradle.kts ]; then
            echo "::error::Expected app/build.gradle.kts was not generated."
            exit 1
          fi

          chmod +x src-tauri/gen/android/gradlew

      # Home-screen widgets: copy the Kotlin/XML from src-tauri/android-widgets into the generated project and register them in the manifest.
      - name: Add the OpenTick home-screen widgets
        run: node scripts/android-widgets.mjs

      # Decode the private key and configure signing only on the runner.
      # No keystore or password is committed to the repository.
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEY_BASE64:?Missing ANDROID_KEY_BASE64 secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/opentick-release.jks"

          printf '%s' "$ANDROID_KEY_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          # Check the keystore and alias before changing Gradle configuration.
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          # Write a runner-only properties file.
          # The key password is assumed to equal the keystore password.
          {
            printf 'storePassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > "$ANDROID_DIR/keystore.properties"

          chmod 600 "$ANDROID_DIR/keystore.properties"

          # Configure the generated Kotlin Gradle build file.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Ensure the imports required for reading signing properties exist.
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text

          # Add the release signing configuration if it is not already present.
          if 'create("release")' not in text:
              match = re.search(r'(?m)^(\s*)buildTypes\s*\{', text)

              if not match:
                  raise SystemExit(
                      "Could not find the Gradle buildTypes block; "
                      "refusing to modify the generated file."
                  )

              indent = match.group(1)

              block = (
                  f'{indent}signingConfigs {{\n'
                  f'{indent}    create("release") {{\n'
                  f'{indent}        val propsFile = rootProject.file("keystore.properties")\n'
                  f'{indent}        val props = Properties()\n'
                  f'{indent}        props.load(FileInputStream(propsFile))\n'
                  f'{indent}        storeFile = file(props["storeFile"] as String)\n'
                  f'{indent}        storePassword = props["storePassword"] as String\n'
                  f'{indent}        keyAlias = props["keyAlias"] as String\n'
                  f'{indent}        keyPassword = props["keyPassword"] as String\n'
                  f'{indent}    }}\n'
                  f'{indent}}}\n\n'
              )

              text = text[:match.start()] + block + text[match.start():]

          # Find the release build type.
          match = re.search(
              r'(?m)^(\s*)getByName\("release"\)\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  'Could not find getByName("release") in build.gradle.kts; '
                  "refusing to guess where signing should be configured."
              )

          # Locate the end of the release block.
          start = match.end()
          depth = 1
          i = start

          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1

          if depth:
              raise SystemExit("Could not locate the end of the release block.")

          release_block = text[match.start():i]

          # Avoid adding the signing assignment twice.
          if "signingConfig = signingConfigs.getByName" not in release_block:
              indent = match.group(1) + "    "

              assignment = (
                  "\n"
                  + indent
                  + 'signingConfig = signingConfigs.getByName("release")'
              )

              text = text[:start] + assignment + text[start:]

          path.write_text(text, encoding="utf-8")
          print("Configured Android release signing.")
          PY

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Build Android App Bundle for Google Play
        run: npx tauri android build

      # versionName / versionCode are generated from the version in tauri.conf.json: prove they still equal package.json's
      - name: Check the Android version matches package.json
        run: node scripts/check-android-version.mjs --generated

      # Fail the job rather than upload an unsigned or invalid APK.
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' -print0
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying APK: $apk"

            "$APKSIGNER" verify --verbose --print-certs "$apk"

            echo "APK signature verified: $apk"
          done

      - name: Verify Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bundles < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print0)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No Android App Bundle was generated."
            find src-tauri/gen/android/app/build/outputs -type f -print | sort
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            jarsigner -verify "$bundle"
            echo "Verified Android App Bundle: $bundle"
          done

      - name: Upload Android APK and App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  snap:
    name: Linux Snap package
    needs: validate
    if: github.event_name == 'push' || inputs.build_snap
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Check project versions
        run: npm run version:check
      - name: Set Snap version
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$CONFIG_VERSION"; fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "::error::Snap version $VERSION must match Tauri version $CONFIG_VERSION."
            exit 1
          fi
          sed -i -E "s/^version:.*/version: '$VERSION'/" snap/snapcraft.yaml
      - name: Install Snapcraft
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/snap/bin:$PATH"
          if ! command -v snap >/dev/null 2>&1; then sudo apt-get update; sudo apt-get install --yes snapd; fi
          sudo systemctl enable --now snapd.socket
          ready=false
          for attempt in {1..30}; do
            if sudo snap list >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then echo "::error::snapd did not become available."; exit 1; fi
          if ! sudo snap list snapcraft >/dev/null 2>&1; then sudo snap install snapcraft --classic --channel=stable; fi
          snapcraft --version
      - name: Build Snap package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/snap/bin:$PATH"
          SNAPCRAFT_BIN="$(command -v snapcraft)"
          sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "$SNAPCRAFT_BIN" pack --destructive-mode --verbosity=brief
          SNAP_FILE="$(find . -maxdepth 1 -type f -name '*.snap' -print -quit)"
          if [[ -z "$SNAP_FILE" ]]; then echo "::error::Snapcraft did not produce a .snap file."; exit 1; fi
          sudo chmod a+r "$SNAP_FILE"
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"
      - name: Upload Snap package
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

  chocolatey-package:
    name: Build Chocolatey package artifact
    needs: desktop
    if: github.event_name == 'push' || inputs.build_desktop
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: OpenTick-Windows
          path: installer
      - name: Package MSI for Chocolatey
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
            if ($tagVersion -ne $version) { throw "Tag version $tagVersion does not match package.json version $version." }
          }
          $msi = Get-ChildItem installer -Recurse -File -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'The Windows build did not produce an MSI.' }
          $url = "https://github.com/JebbyCodes/OpenTick/releases/download/v$version/$($msi.Name)"
          $checksum = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $root = Join-Path $env:RUNNER_TEMP 'opentick-chocolatey'
          $tools = Join-Path $root 'tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $nuspec = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package><metadata>
            <id>opentick</id><version>$version</version><title>OpenTick</title>
            <authors>JebbyCodes</authors><owners>JebbyCodes</owners>
            <projectUrl>https://github.com/JebbyCodes/OpenTick</projectUrl>
            <licenseUrl>https://unlicense.org/</licenseUrl><requireLicenseAcceptance>false</requireLicenseAcceptance>
            <summary>Open-source, offline-first task manager.</summary>
            <description>OpenTick is a free, open-source task manager inspired by TickTick. This package installs the Windows x64 desktop application.</description>
            <tags>opentick task-manager productivity open-source</tags>
            <releaseNotes>https://github.com/JebbyCodes/OpenTick/releases/tag/v$version</releaseNotes>
          </metadata></package>
          "@
          Set-Content (Join-Path $root 'opentick.nuspec') -Value $nuspec -Encoding utf8
          $installScript = @'
          $ErrorActionPreference = 'Stop'
          $packageArgs = @{
              packageName    = 'opentick'
              fileType       = 'msi'
              url64bit       = '__URL__'
              checksum64     = '__SHA256__'
              checksumType64 = 'sha256'
              silentArgs     = '/qn /norestart'
              validExitCodes = @(0, 3010, 1641)
          }
          Install-ChocolateyPackage @packageArgs
          '@
          $installScript = $installScript.Replace('__URL__', $url).Replace('__SHA256__', $checksum)
          Set-Content (Join-Path $tools 'chocolateyinstall.ps1') -Value $installScript -Encoding utf8
          choco pack (Join-Path $root 'opentick.nuspec') --outputdirectory="$root"
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed with exit code $LASTEXITCODE" }
          $nupkg = Join-Path $root "opentick.$version.nupkg"
          if (-not (Test-Path $nupkg)) { throw "Expected package missing: $nupkg" }
          "nupkg=$nupkg" >> $env:GITHUB_OUTPUT
      - name: Upload Chocolatey package
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Chocolatey
          path: ${{ steps.package.outputs.nupkg }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - android
      - snap
      - chocolatey-package
    runs-on: ubuntu-latest

    # Permissions required to publish the release and generate attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false

      # Exclude bundle internals such as copyright files and shared libraries.
      - name: Collect installer packages and APK only
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          mapfile -d '' packages < <(
            find release-assets -type f \( \
              -iname '*.apk' -o \
              -iname '*.aab' -o \
              -iname '*.exe' -o \
              -iname '*.msi' -o \
              -iname '*.msix' -o \
              -iname '*.msixbundle' -o \
              -iname '*.appx' -o \
              -iname '*.appxbundle' -o \
              -iname '*.deb' -o \
              -iname '*.rpm' -o \
              -iname '*.appimage' -o \
              -iname '*.snap' -o \
              -iname '*.nupkg' -o \
              -iname '*.dmg' -o \
              -iname '*.pkg' -o \
              -iname '*.zip' -o \
              -iname '*.tar.gz' -o \
              -iname '*.tar.xz' \
            \) -print0 | sort -z
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No installer packages or APKs were found."
            echo "Downloaded files:"
            find release-assets -type f -print | sort
            exit 1
          fi

          for file in "${packages[@]}"; do
            filename="$(basename "$file")"

            if [ -e "release-files/$filename" ]; then
              echo "::error::Duplicate release asset filename: $filename"
              exit 1
            fi

            cp -- "$file" "release-files/$filename"
            echo "Prepared: $filename"
          done

          echo
          echo "Final release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Total files: ${#packages[@]}"

          (cd release-files && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'RELEASE-MANIFEST.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

          {
            echo "OpenTick release asset manifest"
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Files:"
            find release-files -maxdepth 1 -type f ! -name 'RELEASE-MANIFEST.txt' -printf '%f\n' | sort
          } > release-files/RELEASE-MANIFEST.txt

      # Generate signed SLSA build-provenance attestations for installers.
      - name: Generate release artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release-files/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true
