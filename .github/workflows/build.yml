
name: Build OpenTick

on:
  # Manually build selected platforms from GitHub Actions.
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Build Windows, Linux, and macOS packages
        required: true
        type: boolean
        default: true
      build_android:
        description: Build an Android APK
        required: true
        type: boolean
        default: true

  # Build all platforms and publish a release when a version tag is pushed.
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    if: github.event_name == 'push' || inputs.build_desktop
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-22.04
          - platform: macOS
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Build desktop packages
        run: npx tauri build

      - name: Upload desktop build output
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Install modern command-line tools and platform-tools.
      # Do not request the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager was not found after Android SDK setup."
            exit 1
          fi

          SDKMANAGER_PATH="$(readlink -f "$(command -v sdkmanager)")"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER_PATH")/../../.." && pwd)"

          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android command-line tools were not found in $SDK_ROOT."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK root: $SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Expected Android NDK was not installed: $NDK_PATH"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Initialise Tauri Android project if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

          if [ ! -f src-tauri/gen/android/gradlew ]; then
            echo "::error::The Android Gradle wrapper was not generated."
            exit 1
          fi

          chmod +x src-tauri/gen/android/gradlew

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest

    # Permissions required to publish the release and generate attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false

      # Exclude bundle internals such as copyright files and shared libraries.
      - name: Collect installer packages and APK only
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          mapfile -d '' packages < <(
            find release-assets -type f \( \
              -iname '*.apk' -o \
              -iname '*.exe' -o \
              -iname '*.msi' -o \
              -iname '*.msix' -o \
              -iname '*.appx' -o \
              -iname '*.deb' -o \
              -iname '*.rpm' -o \
              -iname '*.appimage' -o \
              -iname '*.dmg' -o \
              -iname '*.pkg' \
            \) -print0 | sort -z
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No installer packages or APKs were found."
            echo "Downloaded files:"
            find release-assets -type f -print | sort
            exit 1
          fi

          for file in "${packages[@]}"; do
            filename="$(basename "$file")"

            if [ -e "release-files/$filename" ]; then
              echo "::error::Duplicate release asset filename: $filename"
              exit 1
            fi

            cp -- "$file" "release-files/$filename"
            echo "Prepared: $filename"
          done

          echo
          echo "Final release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Total files: ${#packages[@]}"

      # Generate signed SLSA build-provenance attestations for all installers.
      - name: Generate release artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: 'release-files/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true