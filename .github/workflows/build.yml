
name: Build OpenTick

on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Build Windows, Linux, and macOS packages
        required: true
        type: boolean
        default: true
      build_android:
        description: Build a signed Android APK
        required: true
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    if: github.event_name == 'push' || inputs.build_desktop
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-22.04
          - platform: macOS
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Build desktop packages
        run: npx tauri build

      # ---------------------------------------------------------
      # WINDOWS MSIX PACKAGING
      # ---------------------------------------------------------

      - name: Install Microsoft WinApp CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          npm install --global @microsoft/winappcli

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Microsoft WinApp CLI."
          }

          winapp --help

          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft WinApp CLI is not available."
          }

      - name: Build Microsoft Store MSIX package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Find the Tauri Windows executable.
          $exe = Join-Path $PWD "src-tauri/target/release/opentick.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "Available executables:"
            Get-ChildItem "src-tauri/target/release" -Filter "*.exe" |
              ForEach-Object { Write-Host $_.FullName }

            throw "Tauri executable not found: $exe"
          }

          # Determine the four-part MSIX version.
          # Release tags are the source of truth for tagged builds.
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') {
            $rawVersion = $env:RELEASE_TAG -replace '^v', ''

            if ($rawVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
              throw "Invalid release version: $rawVersion. Use vMAJOR.MINOR.PATCH."
            }

            $parts = $rawVersion.Split('.')

            if ($parts.Count -eq 3) {
              $rawVersion = "$rawVersion.0"
            }

            $versionParts = $rawVersion.Split('.')

            foreach ($part in $versionParts) {
              $number = [int]$part

              if ($number -lt 0 -or $number -gt 65535) {
                throw "Invalid MSIX version component: $part"
              }
            }

            $version = $rawVersion
          }
          else {
            # Manual builds use the version already in the manifest.
            [xml]$existingManifest = Get-Content `
              "packaging/msix/Package.appxmanifest" -Raw

            $identity = $existingManifest.SelectSingleNode(
              "//*[local-name()='Identity']"
            )

            if (-not $identity) {
              throw "Package identity not found in manifest."
            }

            $version = $identity.GetAttribute("Version")
          }

          Write-Host "MSIX version: $version"

          # Prepare the MSIX staging directory.
          $stage = Join-Path $PWD "msix-staging"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Copy the existing application manifest.
          $manifestSource = "packaging/msix/Package.appxmanifest"
          $manifestPath = Join-Path $stage "Package.appxmanifest"

          if (-not (Test-Path $manifestSource)) {
            throw "Missing $manifestSource"
          }

          Copy-Item $manifestSource $manifestPath

          # Copy all existing Store logo assets.
          $assetsSource = "packaging/msix/Assets"
          $assetsTarget = Join-Path $stage "Assets"

          if (-not (Test-Path $assetsSource)) {
            throw "Missing MSIX assets directory: $assetsSource"
          }

          Copy-Item $assetsSource $assetsTarget -Recurse -Force

          # Validate every asset referenced by Package.appxmanifest.
          $requiredAssets = @(
            "StoreLogo.png",
            "MedTile.png",
            "AppList.png",
            "WideTile.png"
          )

          foreach ($asset in $requiredAssets) {
            $assetPath = Join-Path $assetsTarget $asset

            if (-not (Test-Path -LiteralPath $assetPath)) {
              throw "Missing required MSIX asset: $assetPath"
            }
          }

          # Update the manifest version without changing its identity.
          [xml]$manifest = Get-Content $manifestPath -Raw

          $identity = $manifest.SelectSingleNode(
            "//*[local-name()='Identity']"
          )

          if (-not $identity) {
            throw "Could not find Identity element in MSIX manifest."
          }

          $identity.SetAttribute("Version", $version)

          $manifest.Save($manifestPath)

          # Copy the Tauri executable.
          Copy-Item $exe $stage

          # Include any DLL dependencies produced alongside the executable.
          Get-ChildItem "src-tauri/target/release" -Filter "*.dll" -File |
            Copy-Item -Destination $stage -Force

          # Verify the executable is the only EXE in the package root.
          $executables = @(Get-ChildItem $stage -Filter "*.exe" -File)

          if ($executables.Count -ne 1) {
            throw "Expected exactly one EXE in MSIX staging, found $($executables.Count)."
          }

          Write-Host "MSIX staging contents:"
          Get-ChildItem $stage -Recurse |
            ForEach-Object { Write-Host $_.FullName }

          # The Store signs the package after submission.
          # Therefore, no self-signed certificate is required.
          $outputDirectory = "src-tauri/target/release/bundle/msix"

          New-Item -ItemType Directory -Force `
            -Path $outputDirectory | Out-Null

          $outputFile = Join-Path `
            $outputDirectory "OpenTick_${version}.msix"

          winapp pack $stage `
            --manifest $manifestPath `
            --executable "opentick.exe" `
            --output $outputFile `
            --no-sign

          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft WinApp CLI failed to create the MSIX."
          }

          if (-not (Test-Path -LiteralPath $outputFile)) {
            throw "MSIX package was not generated: $outputFile"
          }

          Write-Host "MSIX successfully generated:"
          Write-Host $outputFile

          Write-Host "Package size:"
          Get-Item $outputFile |
            Select-Object Name, Length, FullName

      - name: Upload desktop build output
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android Signed APK
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager was not found after Android SDK setup."
            exit 1
          fi

          SDKMANAGER_PATH="$(readlink -f "$(command -v sdkmanager)")"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER_PATH")/../../.." && pwd)"

          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android command-line tools were not found in $SDK_ROOT."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK root: $SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Expected Android NDK was not installed: $NDK_PATH"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::error::Missing src-tauri/icons/icon.png."
            exit 1
          fi

      - name: Initialise Tauri Android project if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

          if [ ! -f src-tauri/gen/android/gradlew ]; then
            echo "::error::The Android Gradle wrapper was not generated."
            exit 1
          fi

          if [ ! -f src-tauri/gen/android/app/build.gradle.kts ]; then
            echo "::error::Expected app/build.gradle.kts was not generated."
            exit 1
          fi

          chmod +x src-tauri/gen/android/gradlew

      - name: Add the OpenTick home-screen widgets
        run: node scripts/android-widgets.mjs

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEY_BASE64:?Missing ANDROID_KEY_BASE64 secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/opentick-release.jks"

          printf '%s' "$ANDROID_KEY_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          {
            printf 'storePassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > "$ANDROID_DIR/keystore.properties"

          chmod 600 "$ANDROID_DIR/keystore.properties"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text

          if 'create("release")' not in text:
              match = re.search(r'(?m)^(\s*)buildTypes\s*\{', text)

              if not match:
                  raise SystemExit(
                      "Could not find the Gradle buildTypes block."
                  )

              indent = match.group(1)

              block = (
                  f'{indent}signingConfigs {{\n'
                  f'{indent}    create("release") {{\n'
                  f'{indent}        val propsFile = rootProject.file("keystore.properties")\n'
                  f'{indent}        val props = Properties()\n'
                  f'{indent}        props.load(FileInputStream(propsFile))\n'
                  f'{indent}        storeFile = file(props["storeFile"] as String)\n'
                  f'{indent}        storePassword = props["storePassword"] as String\n'
                  f'{indent}        keyAlias = props["keyAlias"] as String\n'
                  f'{indent}        keyPassword = props["keyPassword"] as String\n'
                  f'{indent}    }}\n'
                  f'{indent}}}\n\n'
              )

              text = text[:match.start()] + block + text[match.start():]

          match = re.search(
              r'(?m)^(\s*)getByName\("release"\)\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  'Could not find getByName("release").'
              )

          start = match.end()
          depth = 1
          i = start

          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1

          if depth:
              raise SystemExit("Could not locate the end of the release block.")

          release_block = text[match.start():i]

          if "signingConfig = signingConfigs.getByName" not in release_block:
              indent = match.group(1) + "    "

              assignment = (
                  "\n"
                  + indent
                  + 'signingConfig = signingConfigs.getByName("release")'
              )

              text = text[:start] + assignment + text[start:]

          path.write_text(text, encoding="utf-8")
          print("Configured Android release signing.")
          PY

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Check the Android version matches package.json
        run: node scripts/check-android-version.mjs --generated

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' -print0
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying APK: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            echo "APK signature verified: $apk"
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenTick-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false

      - name: Collect installer packages and APK only
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          mapfile -d '' packages < <(
            find release-assets -type f \( \
              -iname '*.apk' -o \
              -iname '*.exe' -o \
              -iname '*.msi' -o \
              -iname '*.msix' -o \
              -iname '*.msixbundle' -o \
              -iname '*.appx' -o \
              -iname '*.deb' -o \
              -iname '*.rpm' -o \
              -iname '*.appimage' -o \
              -iname '*.dmg' -o \
              -iname '*.pkg' \
            \) -print0 | sort -z
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No installer packages or APKs were found."
            find release-assets -type f -print | sort
            exit 1
          fi

          for file in "${packages[@]}"; do
            filename="$(basename "$file")"

            if [ -e "release-files/$filename" ]; then
              echo "::error::Duplicate release asset filename: $filename"
              exit 1
            fi

            cp -- "$file" "release-files/$filename"
            echo "Prepared: $filename"
          done

          echo
          echo "Final release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

          echo "Total files: ${#packages[@]}"

      - name: Generate release artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release-files/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true

  # -----------------------------------------------------------
  # MICROSOFT STORE
  # -----------------------------------------------------------

  microsoft-store:
    name: Publish to Microsoft Store
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-microsoft-store.yml
    with:
      tag: ${{ github.ref_name }}
      draft: false
    secrets: inherit
