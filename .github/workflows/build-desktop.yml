name: Build / Desktop

# Windows (64-bit, 32-bit, ARM64), Linux (64-bit, ARM64) and macOS (Apple Silicon + Intel in one app).
# Windows also gets portable zips and Microsoft Store .msix packages. 32-bit Linux does not exist: Tauri's web view has no 32-bit Linux support.
on:
  workflow_call:
    inputs:
      version:
        description: Version being built (x.y.z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version being built (x.y.z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # the less common targets must not stop a release; the release job lists anything that is missing
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win-x64, name: Windows 64-bit, os: windows-latest, arch: x64, target: x86_64-pc-windows-msvc, bundles: 'nsis,msi', optional: false }
          - { id: win-x86, name: Windows 32-bit, os: windows-latest, arch: x86, target: i686-pc-windows-msvc, bundles: nsis, optional: true }
          - { id: win-arm64, name: Windows ARM64, os: windows-latest, arch: arm64, target: aarch64-pc-windows-msvc, bundles: nsis, optional: true }
          - { id: linux-x64, name: Linux 64-bit, os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm,appimage', optional: false }
          - { id: linux-arm64, name: Linux ARM64, os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu, bundles: 'deb,rpm,appimage', optional: true }
          - { id: macos, name: macOS universal, os: macos-latest, arch: universal, target: universal-apple-darwin, bundles: dmg, optional: false }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file patchelf libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal needs both Mac targets; the others need their own
          targets: ${{ matrix.arch == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id }}

      # signing and notarisation only when the Apple secrets exist; without them the .dmg is simply unsigned
      - name: Apple signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Signing the app with the Apple secrets."
          else
            echo "::notice::No Apple signing secrets: the .dmg will be unsigned (right-click → Open the first time)."
          fi

      - name: Build installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ---- Windows extras: portable zip and Microsoft Store package, from the exe that was just built ----
      - name: Windows portable zip and Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "src-tauri/target/${{ matrix.target }}/release/opentick.exe"
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          Copy-Item $exe staged/OpenTick.exe
          Compress-Archive -Path staged/OpenTick.exe -DestinationPath "staged/OpenTick_${{ inputs.version }}_${{ matrix.arch }}-portable.zip" -Force
          Remove-Item staged/OpenTick.exe
          ./packaging/msix/build-msix.ps1 -Exe $exe -Arch ${{ matrix.arch }} -Version ${{ inputs.version }} -Out staged

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp -v {} staged/ \;
          ls -l staged
          [ -n "$(ls -A staged)" ] || { echo "::error::Nothing was built"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-desktop-${{ matrix.id }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14
