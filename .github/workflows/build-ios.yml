name: Build / iOS

# =====================================================================================================================================
#  Build / iOS: an .ipa for iPhone and iPad
# =====================================================================================================================================
#  Apple only lets a build be installed if it is signed, so this workflow does something only when the signing secrets exist. Without
#  them the build job is SKIPPED (grey in the run, not red) and a notice says which secrets to add. A release never waits on iOS.
#
#  Secrets (all four needed):
#    IOS_CERTIFICATE            your signing certificate (.p12 file), base64 encoded
#    IOS_CERTIFICATE_PASSWORD   its password
#    IOS_MOBILE_PROVISION       the provisioning profile (.mobileprovision file), base64 encoded
#    APPLE_DEVELOPMENT_TEAM     your 10-character Apple team ID
#  See docs/RELEASING.md and https://v2.tauri.app/distribute/sign/ios/
#
#  Artifact: pkg-ios.   Called by: Release.   By hand: Actions -> Build / iOS -> Run workflow.
# =====================================================================================================================================

on:
  workflow_call:
    inputs:
      version:
        description: Version being built (x.y.z); used in the file name
        required: true
        type: string
      export_method:
        description: app-store-connect (TestFlight / App Store), release-testing (ad-hoc, registered devices) or debugging
        required: false
        type: string
        default: release-testing
  workflow_dispatch:
    inputs:
      version:
        description: Version being built (x.y.z); used in the file name
        required: true
        type: string
      export_method:
        description: How the .ipa is exported
        required: false
        type: choice
        options: [release-testing, app-store-connect, debugging]
        default: release-testing

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------------------------------------------------------------
  # 1. Are the Apple secrets there? (Secrets cannot be tested in a job's `if:`, so a tiny job reads them and reports back.)
  # -------------------------------------------------------------------------------------------------------------------------------
  gate:
    name: Are the Apple secrets set?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Look for the four secrets
        id: check
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$PROVISION" ] && [ -n "$TEAM" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS skipped::Add IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION and APPLE_DEVELOPMENT_TEAM to build the .ipa."
          fi

  # -------------------------------------------------------------------------------------------------------------------------------
  # 2. Build and sign the app (only when the gate said yes)
  # -------------------------------------------------------------------------------------------------------------------------------
  ios:
    name: iPhone / iPad (.ipa)
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true   # a failing iOS build is reported, but never blocks the release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install npm packages
        uses: ./.github/actions/setup-node

      - name: Install Rust with the iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      # Tauri reads the four IOS_* / APPLE_* variables to import the certificate and profile and to sign the app.
      - name: Build and sign the .ipa
        shell: bash
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          EXPORT_METHOD: ${{ inputs.export_method || 'release-testing' }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -d src-tauri/gen/apple ] || npx tauri ios init
          npx tauri ios build --export-method "$EXPORT_METHOD"
          mkdir -p staged
          ipa="$(find src-tauri/gen/apple -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "::error::No .ipa was produced"; exit 1; }
          cp "$ipa" "staged/OpenTick_${VERSION}_ios.ipa"

      - name: Upload the file (artifact pkg-ios)
        uses: actions/upload-artifact@v7
        with:
          name: pkg-ios
          path: staged/*.ipa
          if-no-files-found: error
          retention-days: 14
