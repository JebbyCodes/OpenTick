
name: Test OpenTick Snap Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-snap:
    name: Validate and build Snap
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check project versions
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Set Snap version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Tauri version: $VERSION"
            exit 1
          fi

          if ! grep -q '^version:' snap/snapcraft.yaml; then
            echo "ERROR: snap/snapcraft.yaml has no version field."
            exit 1
          fi

          sed -i -E \
            "s/^version:.*/version: '$VERSION'/" \
            snap/snapcraft.yaml

          echo "Snap version: $VERSION"

      - name: Install Snapcraft
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/snap/bin:$PATH"

          if ! command -v snap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes snapd
          fi

          sudo systemctl enable --now snapd.socket

          SNAP_READY=false

          for attempt in {1..30}; do
            if sudo snap list >/dev/null 2>&1; then
              SNAP_READY=true
              break
            fi
            sleep 2
          done

          if [[ "$SNAP_READY" != "true" ]]; then
            echo "ERROR: snapd did not become available."
            sudo systemctl status snapd.socket --no-pager || true
            exit 1
          fi

          if sudo snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft --channel=stable
          else
            sudo snap install snapcraft --classic --channel=stable
          fi

          export PATH="/snap/bin:$PATH"
          snapcraft --version

      - name: Build Snap package without LXD
        id: build
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/snap/bin:$PATH"

          SNAPCRAFT_BIN="$(command -v snapcraft)"
          BUILD_PATH="$PATH"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_DIR="${RUSTUP_HOME:-$HOME/.rustup}"

          echo "Building directly on the Ubuntu 22.04 CI runner."
          echo "LXD is deliberately not used."

          sudo env \
            "PATH=$BUILD_PATH" \
            "CARGO_HOME=$CARGO_DIR" \
            "RUSTUP_HOME=$RUSTUP_DIR" \
            "SNAPCRAFT_BUILD_INFO=1" \
            "$SNAPCRAFT_BIN" pack \
              --destructive-mode \
              --verbosity=brief

          SNAP_FILE="$(find . -maxdepth 1 -type f \
            -name '*.snap' -print -quit)"

          if [[ -z "$SNAP_FILE" ]]; then
            echo "ERROR: Snapcraft did not produce a .snap file."
            find . -maxdepth 3 -type f -name '*.snap' -print || true
            exit 1
          fi

          echo "Built Snap: $SNAP_FILE"
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload test Snap
        uses: actions/upload-artifact@v7
        with:
          name: opentick-snap-test
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 7
