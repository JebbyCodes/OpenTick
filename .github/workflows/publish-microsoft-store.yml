name: Publish / Microsoft Store

# Submits the MSIX bundle from a GitHub Release to the Microsoft Store.
#
# The old workflow tried to point an *unpackaged* (EXE/MSI) Store listing at a download URL. OpenTick's listing is an MSIX app (Store ID 9P…),
# so that never matched. This one uploads the .msixbundle the Release now contains, with `msstore publish`.
#
# Needs: secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET, SELLER_ID; and the Store ID of the app, as the
# repository variable MS_STORE_APP_ID (Partner Center → your app → Product identity → Store ID; looks like 9PDNNTK8TZ39).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (for example v0.5.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.5.1)
        required: true
        type: string
      draft:
        description: Upload but do not submit for certification (keeps the submission as a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-microsoft-store
  cancel-in-progress: false

jobs:
  publish:
    name: Submit to the Store
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_ID: ${{ vars.MS_STORE_APP_ID || '9PDNNTK8TZ39' }}
    steps:
      - name: Credentials present?
        id: gate
        shell: pwsh
        env:
          T: ${{ secrets.AZURE_AD_TENANT_ID }}
          C: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          S: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          I: ${{ secrets.SELLER_ID }}
        run: |
          if ($env:T -and $env:C -and $env:S -and $env:I) { "ready=true" >> $env:GITHUB_OUTPUT }
          else { "ready=false" >> $env:GITHUB_OUTPUT; Write-Host "::warning title=Microsoft Store skipped::Add AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET and SELLER_ID." }

      - name: Download the bundle from the release
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          New-Item -ItemType Directory -Force -Path store | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "OpenTick_${version}.msixbundle" --dir store
          if ($LASTEXITCODE -ne 0) { throw "Release $($env:TAG) has no OpenTick_${version}.msixbundle." }
          # the Store's upload format is a zip holding the bundle
          Compress-Archive -Path "store/OpenTick_${version}.msixbundle" -DestinationPath "store/OpenTick_${version}.zip" -Force
          Move-Item "store/OpenTick_${version}.zip" "store/OpenTick_${version}.msixupload" -Force
          "UPLOAD=$((Resolve-Path "store/OpenTick_${version}.msixupload").Path)" >> $env:GITHUB_ENV

      - name: Set up the Microsoft Store CLI
        if: steps.gate.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Sign in to Partner Center
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI sign-in failed. Check the four secrets.' }

      - name: Upload and submit
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Submitting $env:UPLOAD to Store ID $env:APP_ID"
          $cli = @('publish', (Resolve-Path store).Path, '--inputFile', $env:UPLOAD, '--appId', $env:APP_ID)
          if ('${{ inputs.draft }}' -eq 'true') { $cli += '--noCommit' }
          msstore @args
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE). Is MS_STORE_APP_ID the Store ID of an MSIX app, and is the version higher than the last submission?" }
          Write-Host 'Submitted. Microsoft certification can take a few days.'
