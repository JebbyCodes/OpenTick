name: Microsoft Store publishing (manual preflight only)

# Deliberately manual-only: submission is disabled until the Partner Center schema and CLI flow are verified.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub Release tag to preflight (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Verify Microsoft Store release asset (no submission)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate tag and locate matching installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v?\d+\.\d+\.\d+$') { throw "Expected a stable x.y.z tag, got '$tag'." }
          $version = $tag -replace '^v', ''
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $encodedTag = [uri]::EscapeDataString($tag)
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/JebbyCodes/OpenTick/releases/tags/$encodedTag" -Headers $headers
          if ($release.draft -or $release.prerelease) { throw "Refusing draft or prerelease: $tag" }
          $assetName = 'OpenTick_' + $version + '_x64_en-US.msi'
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1) { $available = ($release.assets | ForEach-Object { $_.name }) -join ', '; throw "Expected one MSI named '$assetName'. Available assets: $available" }
          Write-Host "Preflight passed: $($asset[0].name)"
          Write-Host "URL: $($asset[0].browser_download_url)"
          Write-Host 'No Microsoft Store submission was made. Store publishing remains disabled until its API schema and CLI flow are verified.'