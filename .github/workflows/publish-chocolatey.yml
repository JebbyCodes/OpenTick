name: Publish / Chocolatey

# Builds the Chocolatey package from the MSI in a GitHub Release, attaches it to the release and pushes it to community.chocolatey.org.
on:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag (for example v0.5.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (for example v0.5.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chocolatey-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check the tag
        id: release
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v?(\d+\.\d+\.\d+)$') { throw "Tag '$($env:TAG)' is not a stable x.y.z version." }
          "tag=$($env:TAG)" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Download the MSI and calculate its SHA-256
        id: installer
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)/OpenTick_$($env:VERSION)_x64_en-US.msi"
          $msi = Join-Path $env:RUNNER_TEMP 'opentick.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          if (!(Test-Path $msi) -or (Get-Item $msi).Length -eq 0) { throw "The release MSI could not be downloaded or is empty: $url" }
          "url=$url" >> $env:GITHUB_OUTPUT
          "checksum=$((Get-FileHash $msi -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT

      - name: Generate the package files
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          MSI_URL: ${{ steps.installer.outputs.url }}
          MSI_SHA256: ${{ steps.installer.outputs.checksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'opentick-chocolatey'
          $tools = Join-Path $dir 'tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $nuspec = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>opentick</id>
              <version>$($env:VERSION)</version>
              <title>OpenTick</title>
              <authors>JebbyCodes</authors>
              <owners>JebbyCodes</owners>
              <projectUrl>https://github.com/JebbyCodes/OpenTick</projectUrl>
              <licenseUrl>https://unlicense.org/</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <copyright>Copyright 2026 JebbyCodes</copyright>
              <tags>opentick task-manager productivity ticktick open-source</tags>
              <summary>Open-source task manager inspired by TickTick.</summary>
              <description>
          OpenTick is a free, open-source task manager inspired by TickTick. This package installs the Windows x64 desktop application. OpenTick does not require a paid licence or trial activation. It is under active development, so features and behaviour may change between releases.
              </description>
              <releaseNotes>https://github.com/JebbyCodes/OpenTick/releases/tag/$($env:TAG)</releaseNotes>
            </metadata>
          </package>
          "@
          Set-Content -Path (Join-Path $dir 'opentick.nuspec') -Value ($nuspec -replace '(?m)^          ', '') -Encoding utf8
          $install = @'
          $ErrorActionPreference = 'Stop'
          $packageArgs = @{
            packageName    = 'opentick'
            fileType       = 'msi'
            url64bit       = '__MSI_URL__'
            checksum64     = '__MSI_SHA256__'
            checksumType64 = 'sha256'
            silentArgs     = '/qn /norestart'
            validExitCodes = @(0, 3010, 1641)
          }
          Install-ChocolateyPackage @packageArgs
          '@
          $install = ($install -replace '(?m)^          ', '').Replace('__MSI_URL__', $env:MSI_URL).Replace('__MSI_SHA256__', $env:MSI_SHA256)
          Set-Content -Path (Join-Path $tools 'chocolateyinstall.ps1') -Value $install -Encoding utf8
          "PACKAGE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Pack and check
        id: pack
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco pack (Join-Path $env:PACKAGE_DIR 'opentick.nuspec') --outputdirectory="$env:PACKAGE_DIR"
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed ($LASTEXITCODE)" }
          $nupkg = Join-Path $env:PACKAGE_DIR "opentick.$($env:VERSION).nupkg"
          if (!(Test-Path $nupkg)) { throw "Expected package was not created: $nupkg" }
          if ((& tar -tf $nupkg) -match '(^|/)VERIFICATION\.txt$') { throw 'Package unexpectedly contains VERIFICATION.txt.' }
          "nupkg=$nupkg" >> $env:GITHUB_OUTPUT

      - name: Attach the package to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload $env:TAG $env:NUPKG --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach the package to the release.' }

      - name: Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) { Write-Host '::warning title=Chocolatey skipped::Add the CHOCOLATEY_API_KEY secret.'; exit 0 }
          choco push "$env:NUPKG" --source="'https://push.chocolatey.org/'" --api-key="'$env:CHOCO_API_KEY'"
          if ($LASTEXITCODE -ne 0) { throw "choco push failed ($LASTEXITCODE)" }
