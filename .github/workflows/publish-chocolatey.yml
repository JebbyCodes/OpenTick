name: Publish Chocolatey Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish (for example v0.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chocolatey-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release's Chocolatey package
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - name: Download and validate package from GitHub Release
        id: package
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:MANUAL_TAG.Trim()
          } else {
            if ($env:IS_PRERELEASE -eq 'true') { throw 'Refusing to publish a prerelease to Chocolatey.' }
            $tag = $env:EVENT_TAG.Trim()
          }
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') { throw "Not a stable x.y.z tag: $tag" }
          $version = $Matches[1]
          $tag = "v$version"
          $asset = "opentick.$version.nupkg"
          $url = "https://github.com/JebbyCodes/OpenTick/releases/download/$tag/$asset"
          $path = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $path
          if (!(Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Release package missing or empty: $url" }
          $entries = & tar -tf $path
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded .nupkg is not a valid archive.' }
          if ($entries -match '(^|/)VERIFICATION\.txt$') { throw 'Package unexpectedly contains VERIFICATION.txt.' }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Validated release package $asset"

      - name: Publish to Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          NUPKG_PATH: ${{ steps.package.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) { throw 'Missing CHOCOLATEY_API_KEY secret.' }
          choco push "$env:NUPKG_PATH" --source https://push.chocolatey.org/ --api-key "$env:CHOCO_API_KEY"
          if ($LASTEXITCODE -ne 0) { throw "choco push failed with exit code $LASTEXITCODE" }
