name: opentick
base: core22
version: '0.4.0'
summary: Open-source, offline-first task manager
description: |
  OpenTick is an open-source task manager for desktop and mobile.
  Organise tasks, projects, notes, calendars, timetables and Gantt
  plans. Your data stays local by default, with optional sync.
grade: stable
confinement: strict

layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  opentick:
    command: usr/bin/opentick
    desktop: usr/share/applications/opentick.desktop
    extensions: [gnome]
    plugs:
      - network
      - home
      - removable-media

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/20/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      npm ci
      npm run tauri build -- --bundles deb

      DEB="$(find src-tauri/target/release/bundle/deb \
        -maxdepth 1 -name '*.deb' -print -quit)"
      test -n "$DEB"

      dpkg-deb -x "$DEB" "$SNAPCRAFT_PART_INSTALL"

      DESKTOP="$SNAPCRAFT_PART_INSTALL/usr/share/applications/opentick.desktop"
      test -f "$DESKTOP"
      sed -i 's|^Icon=.*|Icon=/usr/share/icons/hicolor/32x32/apps/opentick.png|' "$DESKTOP"