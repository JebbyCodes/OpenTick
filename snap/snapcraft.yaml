name: opentick
base: core22
version: '0.5.2'
summary: Open-source, offline-first task manager
description: |
  OpenTick is an open-source, offline-first task manager.
  Organise tasks, projects, notes, timetables and Gantt plans
  with a cross-platform interface.

icon: src-tauri/icons/128x128@2x.png

grade: stable
confinement: strict

layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  opentick:
    command: usr/bin/opentick
    desktop: usr/share/applications/opentick.desktop
    extensions:
      - gnome
    plugs:
      - home
      - network
      - removable-media

parts:
  build-app:
    plugin: dump
    source: .

    build-snaps:
      - node/22/stable
      - rustup/latest/stable

    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg

    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1

    override-build: |
      set -eu
      npm ci
      npm run tauri build -- --bundles deb
      DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
      [ -n "$DEB" ] || { echo "ERROR: Tauri did not produce a Debian package."; exit 1; }
      # unpack it and fix the desktop entry and icon (shared with the CI snap, which is handed a prebuilt .deb)
      bash snap/local/assemble.sh "$DEB" "$SNAPCRAFT_PART_INSTALL" src-tauri/icons/128x128.png
